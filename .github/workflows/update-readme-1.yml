
name: Update Linux Commit

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Linux commit
        run: |
          curl -fsSL \
            "https://api.github.com/repos/torvalds/linux/commits?per_page=1" \
            -o commit.json

          MESSAGE=$(jq -r '.[0].commit.message | split("\n")[0]' commit.json)
          DATE=$(jq -r '.[0].commit.committer.date' commit.json | cut -dT -f1)
          SHA=$(jq -r '.[0].sha' commit.json)
          URL=$(jq -r '.[0].html_url' commit.json)

          export MESSAGE DATE SHA URL

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text()

          replacement = (
              f"**[{os.environ['MESSAGE']}]({os.environ['URL']})**  \n"
              f"📅 {os.environ['DATE']} · "
              f"`{os.environ['SHA'][:7]}`"
          )

          start = "<!-- LINUX_COMMIT_START -->"
          end = "<!-- LINUX_COMMIT_END -->"

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          path.write_text(
              before + start + "\n" +
              replacement + "\n" + end + after
          )
          PY

      - name: Push README update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update Linux latest commit"
            git push
          fi
