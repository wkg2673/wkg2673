
name: Update Commit

on:
  schedule:
    - cron: "34 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find most recently updated repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/wkg2673/repos?type=owner&sort=pushed&direction=desc&per_page=100" \
            -o repos.json

          REPO=$(jq -r \
            --arg profile "wkg2673/wkg2673" \
            '[.[] | select(
              .private == false and
              (.full_name | ascii_downcase) != $profile
            )] | first | .full_name // empty' repos.json)

          if [ -z "$REPO" ]; then
            echo "No eligible public repositories found."
            exit 1
          fi

          echo "Most recently pushed repository: $REPO"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/commits?per_page=1" \
            -o commit.json

          MESSAGE=$(jq -r '.[0].commit.message | split("\n")[0]' commit.json)
          DATE=$(jq -r '.[0].commit.committer.date' commit.json | cut -dT -f1)
          SHA=$(jq -r '.[0].sha' commit.json)
          URL=$(jq -r '.[0].html_url' commit.json)

          export MESSAGE DATE SHA URL REPO

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text()

          start = "<!-- COMMIT_START -->"
          end = "<!-- COMMIT_END -->"

          if start not in content or end not in content:
              raise ValueError("README is missing commit markers")

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          replacement = (
              f"**[{os.environ['MESSAGE']}]"
              f"({os.environ['URL']})**  \n"
              f"{os.environ['DATE']} · "
              f"`{os.environ['SHA'][:7]}`  \n"
              f"Repository: "
              f"[{os.environ['REPO']}]"
              f"(https://github.com/{os.environ['REPO']})"
          )

          path.write_text(
              before + start + "\n" +
              replacement + "\n" + end + after
          )
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): update latest project commit"
            git push
          else
            echo "README is already up to date."
          fi
