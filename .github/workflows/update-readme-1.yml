
name: Update Commit

on:
  schedule:
    - cron: "34 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest Meridian Terminal commit
        run: |
          curl -fsSL \
            "https://api.github.com/repos/wkg2673/meridian-terminal/commits?per_page=1" \
            -o commit.json

          MESSAGE=$(jq -r '.[0].commit.message | split("\n")[0]' commit.json)
          DATE=$(jq -r '.[0].commit.committer.date' commit.json | cut -dT -f1)
          SHA=$(jq -r '.[0].sha' commit.json)
          URL=$(jq -r '.[0].html_url' commit.json)

          export MESSAGE DATE SHA URL

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text()

          start = "<!-- COMMIT_START -->"
          end = "<!-- COMMIT_END -->"

          if start not in content or end not in content:
              raise ValueError(
                  "README is missing COMMIT_START "
                  "or COMMIT_END markers"
              )

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          replacement = (
              f"**[{os.environ['MESSAGE']}]"
              f"({os.environ['URL']})**  \n"
              f"{os.environ['DATE']} · "
              f"`{os.environ['SHA'][:7]}`"
          )

          path.write_text(
              before + start + "\n" +
              replacement + "\n" + end + after
          )
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore(readme): update latest project commit"
            git push
          else
            echo "README is already up to date."
          fi
