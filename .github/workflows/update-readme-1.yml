name: Update latest linux kernel commit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update latest linux kernel commit
        run: |
          MESSAGE=$(git log -1 --pretty=%s)
          DATE=$(git log -1 --date=short --pretty=%cd)
          HASH=$(git rev-parse --short HEAD)
          URL="https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"

          python3 -c '
          import os
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text()

          message = os.environ["MESSAGE"]
          date = os.environ["DATE"]
          hash = os.environ["HASH"]
          url = os.environ["URL"]

          replacement = (
              f"**[{message}]({url})**  \n"
              f"📅 {date} · `{hash}`"
          )

          start = "<!-- LATEST_COMMIT_START -->"
          end = "<!-- LATEST_COMMIT_END -->"

          before, rest = content.split(start, 1)
          _, after = rest.split(end, 1)

          path.write_text(
              before + start + "\n" +
              replacement + "\n" + end + after
          )
          '
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.event.repository.updated_at }}
          DATE: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          HASH: ${{ github.sha }}
          URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

      - name: Commit README changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet || (
            git commit -m "docs: update latest commit"
            git push
          )
