name: Update README timestamp

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          TIMESTAMP=$(TZ=Europe/Vienna date +"%b %d %Y, %H:%M (UTC%:z)")
          sed -i "s|^Last edited - .*|Last edited - $TIMESTAMP|" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update README timestamp"
          git push
